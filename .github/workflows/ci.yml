name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-testing-secret-key-do-not-use-in-production-12345"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Database Push
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Static Typecheck
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Deterministic Engine Tests
        run: |
          node tests/all-parameters-qa.mjs
          node tests/multi-candidate-qa.mjs

      - name: Run Production Next.js Build
        run: npm run build

