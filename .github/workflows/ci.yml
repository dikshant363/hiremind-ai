name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "file:../db/custom.db"
      AUTH_SECRET: "ci-testing-secret-key-do-not-use-in-production-12345"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Database Push
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Static Typecheck
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Production Next.js Build
        run: npm run build

      - name: Start Server & Run Deterministic QA Tests
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Wait for server health endpoint
          echo "Waiting for server to become healthy..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Server is healthy on attempt $i"
              break
            fi
            sleep 1
          done
          
          # Run verification test suites
          node tests/all-parameters-qa.mjs
          node tests/multi-candidate-qa.mjs
          node tests/auth-and-config-qa.mjs
          
          # Cleanly terminate background server
          kill $SERVER_PID || true


